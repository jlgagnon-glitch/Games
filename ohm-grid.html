<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ohm Grid — a resistor tile game</title>
<style>
:root{--bg:#f4f1ea;--ink:#1f2328;--muted:#6b6f76;--card:#fffdf8;--line:#d8d2c4;--p0:#2563eb;--p1:#e0611a;--good:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:#fffaf0}
header h1{font-size:20px;margin:0;letter-spacing:.5px}
header h1 span{color:var(--p1)}
.score{display:flex;gap:10px;font-weight:600}
.score .chip{padding:4px 10px;border-radius:999px;background:#fff;border:2px solid}
.spacer{flex:1}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover:not(:disabled){background:#f0ebe0}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover{background:#3a3f46}
main{display:flex;flex-wrap:wrap;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
#boardWrap{flex:1 1 560px;min-width:300px}
#board{width:100%;height:auto;background:#fffdf8;border:1px solid var(--line);border-radius:12px;touch-action:manipulation;user-select:none}
#meterRow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
#meter{font:600 18px ui-monospace,Menlo,Consolas,monospace;padding:6px 12px;border-radius:8px;background:#1f2328;color:#9effa8;min-width:220px}
label.tog{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
aside{flex:0 1 380px;min-width:290px;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
#turnInfo{font-weight:700;font-size:17px}
#turnInfo small{font-weight:400;color:var(--muted)}
h3{margin:4px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.card{width:64px;height:88px;border-radius:9px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:700;position:relative;transition:transform .1s}
.card:hover{transform:translateY(-3px)}
.card.sel{border-color:var(--ink);box-shadow:0 0 0 3px #ffd54a}
.card .v{font-size:20px}
.card .t{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.card.solder{background:#fff6e0}
.card.wire{background:#eef6ff}
.card.disabled{opacity:.4;pointer-events:none}
.secret{font-size:14px;line-height:1.45}
.secret ul{margin:4px 0 0;padding-left:18px}
.peek{user-select:none}
.blur{filter:blur(6px)}
#actions{display:flex;gap:8px;flex-wrap:wrap}
#hint{font-size:13px;color:var(--muted);min-height:18px}
#log{font-size:13px;color:var(--muted);max-height:130px;overflow:auto}
#log div{padding:2px 0;border-bottom:1px dashed #ece6d8}
#modal{position:fixed;inset:0;background:rgba(20,20,20,.55);display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
#modal.show{display:flex}
#modal .box{background:#fffdf8;border-radius:14px;max-width:600px;width:100%;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.3);position:relative;margin:auto 0}
#modal.float{background:transparent;pointer-events:none}
#modal.float .box{pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.35);border:2px solid var(--ink)}
#modal.mini{display:none!important}
.dragbar{display:flex;align-items:center;gap:8px;margin:-20px -22px 12px;padding:8px 12px;background:var(--ink);color:#fff;border-radius:12px 12px 0 0;cursor:move;touch-action:none;user-select:none;font-size:13px}
.dragbar button{padding:4px 10px;font-size:13px}
#miniBar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:11;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#miniBar.show{display:block}
#modal .x{position:absolute;top:10px;right:10px;font-size:20px;line-height:1;padding:4px 10px}
#modal h2{margin-top:0}
.objopt{display:block;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer}
.objopt.on{border-color:var(--ink);background:#fff6d6}
table.res{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
table.res td,table.res th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
input[type=text]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;width:120px}
select{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line)}
.credit{font-size:12px;color:var(--muted);text-align:center;padding:8px 16px 20px}
svg text{font-family:system-ui,sans-serif}
.slot{stroke:transparent;stroke-width:22;cursor:pointer}
.slotvis{stroke:#e7e0d0;stroke-width:2;stroke-dasharray:4 5}
.piece{cursor:default}
.piece.target{cursor:pointer}
.piece.target:hover{opacity:.55}
</style>
</head>
<body>
<header>
  <h1>Ohm <span>Grid</span></h1>
  <div class="score" id="score"></div>
  <div class="spacer"></div>
  <button id="btnRules">How to play</button>
  <button id="btnNew">New match</button>
</header>

<main>
  <section id="boardWrap">
    <svg id="board" viewBox="0 0 740 580"></svg>
    <div id="meterRow">
      <div id="meter">R<sub>AB</sub> = ?</div>
      <label class="tog"><input type="checkbox" id="chkLive"> Show live R<sub>AB</sub> (practice mode)</label>
      <label class="tog"><input type="checkbox" id="chkCurrent"> Show currents (12 V across A–B)</label>
    </div>
  </section>
  <aside>
    <div class="panel">
      <div id="turnInfo"></div>
      <div id="hint"></div>
    </div>
    <div class="panel secret" id="secretPanel"></div>
    <div class="panel">
      <h3>Hand</h3>
      <div class="cards" id="hand"></div>
      <h3 style="margin-top:12px">Shared wire pool</h3>
      <div class="cards" id="pool"></div>
      <div id="actions" style="margin-top:12px">
        <button id="btnDiscard" disabled>Discard &amp; draw</button>
        <button id="btnEnd" disabled>End turn</button>
      </div>
    </div>
    <div class="panel"><h3>Log</h3><div id="log"></div></div>
  </aside>
</main>
<div class="credit">Game mechanics adapted from the published game-based resistor lab by O'Brien, Sirokman, Rueckert &amp; Cascio (Wentworth Institute of Technology, ASEE 2015). Original implementation.</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<button id="miniBar" class="primary">▲ Show the calculation window</button>

<script>
"use strict";
// ---------- constants ----------
const COLS=9, ROWS=7, MID=3, SP=80, MX=50, MY=50, VBATT=12;
const nid=(x,y)=>y*COLS+x, nx=n=>n%COLS, ny=n=>Math.floor(n/COLS);
const A=nid(0,MID), B=nid(COLS-1,MID);
const ekey=(a,b)=>a<b?a+'-'+b:b+'-'+a;
const px=n=>MX+nx(n)*SP, py=n=>MY+ny(n)*SP;
const PCOL=['#2563eb','#e0611a'];
const TARGETS=[2,3,4,5,6,7.5,8,9,10,12,15,18,20];
const RES_VALUES=[1,1,1,2,2,2,3,3,3,4,4,4,5,5,6,6,6,8,8,10,10,12,12,15,20,1,2,3,4,6];
const ALL_SLOTS=[];
for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  if(x<COLS-1) ALL_SLOTS.push([nid(x,y),nid(x+1,y)]);
  if(y<ROWS-1) ALL_SLOTS.push([nid(x,y),nid(x,y+1)]);
}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=R=>R===Infinity?'∞':(Math.abs(R)<1e-9?'0':(+R.toPrecision(3)).toString());
const $=id=>document.getElementById(id);

// ---------- circuit analysis ----------
function solveLinear(G,b){
  const n=b.length;
  for(let c=0;c<n;c++){
    let p=c;for(let r=c+1;r<n;r++)if(Math.abs(G[r][c])>Math.abs(G[p][c]))p=r;
    [G[c],G[p]]=[G[p],G[c]];[b[c],b[p]]=[b[p],b[c]];
    const d=G[c][c]; if(Math.abs(d)<1e-14) return null;
    for(let r=c+1;r<n;r++){const f=G[r][c]/d; if(!f)continue; for(let k=c;k<n;k++)G[r][k]-=f*G[c][k]; b[r]-=f*b[c];}
  }
  const x=new Array(n).fill(0);
  for(let r=n-1;r>=0;r--){let s=b[r];for(let k=r+1;k<n;k++)s-=G[r][k]*x[k];x[r]=s/G[r][r];}
  return x;
}

function analyze(pieces){
  const parent=new Map();
  const find=n=>{if(!parent.has(n))parent.set(n,n);let r=n;while(parent.get(r)!==r)r=parent.get(r);while(parent.get(n)!==r){const t=parent.get(n);parent.set(n,r);n=t;}return r;};
  const uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)parent.set(a,b);};
  find(A);find(B);
  for(const p of pieces){ if(p.type==='W') for(const [a,b] of p.edges) uni(a,b); }
  const nA=find(A), nB=find(B);
  const res=pieces.filter(p=>p.type==='R').map(p=>{const a=find(p.edges[0][0]),b=find(p.edges[0][1]);return{p,a,b,shorted:a===b,I:0,V:0,P:0,active:false,connected:false};});
  const adj=new Map();const add=(u,v)=>{if(!adj.has(u))adj.set(u,[]);adj.get(u).push(v);};
  for(const r of res) if(!r.shorted){add(r.a,r.b);add(r.b,r.a);}
  const bfs=s=>{const seen=new Set([s]);const q=[s];while(q.length){const u=q.shift();for(const v of adj.get(u)||[])if(!seen.has(v)){seen.add(v);q.push(v);}}return seen;};
  const comp=bfs(nA), compB=bfs(nB);
  for(const r of res) r.connected=comp.has(r.a)||comp.has(r.b)||compB.has(r.a)||compB.has(r.b);
  const out={pieces,nA,nB,find,res,R:Infinity,open:true,short:false,netV:new Map()};
  if(nA===nB){out.R=0;out.open=false;out.short=true;return out;}
  if(!comp.has(nB)) return out;
  const nets=[...comp].filter(n=>n!==nB), idx=new Map(nets.map((n,i)=>[n,i])), N=nets.length;
  const G=Array.from({length:N},()=>new Array(N).fill(0)), rhs=new Array(N).fill(0);
  for(const r of res){
    if(r.shorted||!comp.has(r.a))continue;
    const g=1/r.p.value, iu=idx.get(r.a), iv=idx.get(r.b);
    if(iu!==undefined)G[iu][iu]+=g; if(iv!==undefined)G[iv][iv]+=g;
    if(iu!==undefined&&iv!==undefined){G[iu][iv]-=g;G[iv][iu]-=g;}
  }
  rhs[idx.get(nA)]=1;
  const V=solveLinear(G,rhs); if(!V) return out;
  const R=V[idx.get(nA)];
  out.R=R; out.open=false;
  const scale=VBATT/R;
  const volt=n=>n===nB?0:(idx.has(n)?V[idx.get(n)]*scale:null);
  for(const n of comp) out.netV.set(n,volt(n));
  for(const r of res){
    if(r.shorted||!comp.has(r.a))continue;
    r.V=Math.abs(volt(r.a)-volt(r.b)); r.I=r.V/r.p.value; r.P=r.V*r.I; r.active=r.I>1e-7;
  }
  return out;
}
const closed=c=>isFinite(c.R)&&c.R>0;

function maxSeries(c){
  const act=c.res.filter(r=>r.active); if(!act.length)return 0;
  const par=act.map((_,i)=>i);const f=i=>par[i]===i?i:(par[i]=f(par[i]));
  const byNet=new Map();
  act.forEach((r,i)=>{for(const n of[r.a,r.b]){if(!byNet.has(n))byNet.set(n,[]);byNet.get(n).push(i);}});
  for(const [n,l] of byNet) if(l.length===2&&n!==c.nA&&n!==c.nB) par[f(l[0])]=f(l[1]);
  const cnt=new Map();act.forEach((_,i)=>cnt.set(f(i),(cnt.get(f(i))||0)+1));
  return Math.max(...cnt.values());
}

// ---------- secondary objectives ----------
const OBJ=[
 {id:'series',name:'Series Run',desc:'3 or more current-carrying resistors chained in series.',check:(c)=>closed(c)&&maxSeries(c)>=3},
 {id:'parallel',name:'Side by Side',desc:'2 or more current-carrying resistors directly in parallel (same two junctions).',check:(c)=>{if(!closed(c))return false;const m=new Map();for(const r of c.res)if(r.active){const k=Math.min(r.a,r.b)+'|'+Math.max(r.a,r.b);m.set(k,(m.get(k)||0)+1);}return[...m.values()].some(v=>v>=2);}},
 {id:'bypass',name:'Bypass',desc:'At least one resistor is shorted out (both ends on the same junction).',check:(c)=>c.res.some(r=>r.shorted)},
 {id:'deadend',name:'Dead End',desc:'Circuit is closed, and a resistor touching it carries no current (not shorted).',check:(c)=>closed(c)&&c.res.some(r=>r.connected&&!r.shorted&&!r.active)},
 {id:'heavy',name:'Heavy Hitter',desc:'A resistor of 10 Ω or more that YOU placed carries current.',check:(c,pi)=>c.res.some(r=>r.active&&r.p.owner===pi&&r.p.value>=10)},
 {id:'hotspot',name:'Hot Spot',desc:'With 12 V across A–B, the resistor dissipating the most power is one YOU placed.',check:(c,pi)=>{if(!closed(c))return false;const a=c.res.filter(r=>r.active);if(!a.length)return false;const m=Math.max(...a.map(r=>r.P));return a.some(r=>r.P>=m-1e-9&&r.p.owner===pi);}},
 {id:'wires',name:'Wire Weaver',desc:'YOU have 3 or more wire pieces on the board.',check:(c,pi)=>c.pieces.filter(p=>p.type==='W'&&p.owner===pi).length>=3},
 {id:'builder',name:'Builder',desc:'YOU have 5 or more resistors on the board.',check:(c,pi)=>c.pieces.filter(p=>p.type==='R'&&p.owner===pi).length>=5},
];
const objById=id=>OBJ.find(o=>o.id===id);

// ---------- state ----------
let S=null;
function mkPlayer(name,isAI){return{name,isAI,score:0,hand:[],target:0,offered:[],secret:[],predict:null};}
function newMatch(mode,turnsEach){
  S={mode,turnsEach,game:0,players:[mkPlayer('Player 1',false),mkPlayer(mode==='ai'?'Computer':'Player 2',mode==='ai')],showLive:$('chkLive').checked,showCurrent:false,log:[]};
  newGame();
}
function buildDeck(){
  const d=RES_VALUES.map(v=>({type:'R',value:v}));
  for(let i=0;i<4;i++)d.push({type:'S'});
  return shuffle(d);
}
function buildWireDeck(){const d=[];for(let i=0;i<10;i++)d.push({type:'W',len:1});for(let i=0;i<8;i++)d.push({type:'W',len:2});for(let i=0;i<5;i++)d.push({type:'W',len:3});return shuffle(d);}
function drawRes(){if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[];if(!S.deck.length)S.deck=buildDeck();}return S.deck.pop();}
function drawWire(){if(!S.wireDeck.length)S.wireDeck=buildWireDeck();return S.wireDeck.pop();}
function newGame(){
  S.game++;S.pieces=[];S.nextPid=1;S.deck=buildDeck();S.discard=[];S.wireDeck=buildWireDeck();
  S.pool=[drawWire(),drawWire(),drawWire()];
  const tg=shuffle(TARGETS.slice());
  S.players.forEach((p,i)=>{p.hand=[];for(let k=0;k<5;k++)p.hand.push(drawRes());p.target=tg[i];p.offered=shuffle(OBJ.map(o=>o.id)).slice(0,3);p.secret=[];p.predict=null;});
  S.turn=(S.game-1)%2;S.turnsTaken=[0,0];S.phase='setup';S.sel=null;S.preview=null;S.bonus=false;S.showCurrent=false;$('chkCurrent').checked=false;
  S.log=[];addLog(`Game ${S.game} begins. ${S.players[S.turn].name} goes first.`);
  rebuildIndex();
  setupObjectives(0);
}
function rebuildIndex(){
  S.occupied=new Map();S.nodeUse=new Map();
  for(const p of S.pieces)for(const [a,b] of p.edges){S.occupied.set(ekey(a,b),p.id);S.nodeUse.set(a,(S.nodeUse.get(a)||0)+1);S.nodeUse.set(b,(S.nodeUse.get(b)||0)+1);}
}
const inCircuit=n=>n===A||n===B||(S.nodeUse.get(n)||0)>0;
function addLog(t){S.log.unshift(t);if(S.log.length>60)S.log.pop();}
const cur=()=>S.players[S.turn];
const humanCount=()=>S.players.filter(p=>!p.isAI).length;

// ---------- objective selection ----------
function setupObjectives(i){
  if(i>=2){S.phase='play';render();maybeAI();return;}
  const p=S.players[i];
  if(p.isAI){p.secret=p.offered.slice(0,2);setupObjectives(i+1);return;}
  const show=()=>{
    let chosen=[];
    const body=()=>`<h2>${p.name}: your secret goals</h2>
      <p><b>Primary target:</b> get the final resistance between A and B as close as possible to <b style="font-size:22px">${fmt(p.target)} Ω</b> (worth 2 points).</p>
      <p>Choose <b>2</b> of these 3 bonus goals (1 point each):</p>
      ${p.offered.map(id=>{const o=objById(id);return`<label class="objopt ${chosen.includes(id)?'on':''}" data-o="${id}"><b>${o.name}</b> — ${o.desc}</label>`;}).join('')}
      <div class="row"><button class="primary" id="okObj" ${chosen.length===2?'':'disabled'}>Lock in</button></div>`;
    const draw=()=>{openModal(body());
      document.querySelectorAll('.objopt').forEach(el=>el.onclick=()=>{const id=el.dataset.o;if(chosen.includes(id))chosen=chosen.filter(x=>x!==id);else{chosen.push(id);if(chosen.length>2)chosen.shift();}draw();});
      $('okObj').onclick=()=>{p.secret=chosen.slice();closeModal();setupObjectives(i+1);};};
    draw();
  };
  if(humanCount()>1){openModal(`<h2>Pass the device to ${p.name}</h2><p>The other player should look away while ${p.name} picks secret goals.</p><button class="primary" id="ready">I'm ${p.name} — show me</button>`);$('ready').onclick=show;}
  else show();
}

// ---------- placement ----------
function cardOf(sel,pi){if(!sel)return null;return sel.src==='hand'?S.players[pi].hand[sel.i]:S.pool[sel.i];}
function placementFor(card,slot){
  if(!card||card.type==='S')return null;
  const L=card.type==='W'?card.len:1;
  const [a]=slot;const horiz=ny(slot[0])===ny(slot[1]);const x=nx(a),y=ny(a);
  const max=horiz?COLS-1:ROWS-1;
  for(let s=0;s<L;s++){
    const st=(horiz?x:y)-s; if(st<0||st+L>max)continue;
    const edges=[];let ok=true;
    for(let i=0;i<L;i++){const p=horiz?nid(st+i,y):nid(x,st+i),q=horiz?nid(st+i+1,y):nid(x,st+i+1);if(S.occupied.has(ekey(p,q))){ok=false;break;}edges.push([p,q]);}
    if(!ok)continue;
    if(!edges.flat().some(inCircuit))continue;
    return edges;
  }
  return null;
}
function makePiece(card,edges,owner){return card.type==='R'?{id:S.nextPid++,type:'R',value:card.value,owner,edges}:{id:S.nextPid++,type:'W',len:card.len,owner,edges};}
function doPlace(sel,edges){
  const pi=S.turn,p=cur(),card=cardOf(sel,pi);
  S.pieces.push(makePiece(card,edges,pi));
  if(sel.src==='hand'){p.hand.splice(sel.i,1);p.hand.push(drawRes());}
  else{S.pool.splice(sel.i,1);S.pool.push(drawWire());}
  addLog(`${p.name} placed ${card.type==='R'?`a ${card.value} Ω resistor`:`a length-${card.len} wire`}.`);
  rebuildIndex();S.sel=null;S.preview=null;
  endTurn();
}
function doSolder(handIdx,pieceId){
  const p=cur();const pc=S.pieces.find(q=>q.id===pieceId);
  S.pieces=S.pieces.filter(q=>q.id!==pieceId);
  S.discard.push(p.hand.splice(handIdx,1)[0]);p.hand.push(drawRes());
  if(pc.type==='R')S.discard.push({type:'R',value:pc.value});
  addLog(`${p.name} used Solder to remove ${pc.type==='R'?`a ${pc.value} Ω resistor`:'a wire'}. They may place one more piece.`);
  rebuildIndex();S.sel=null;S.preview=null;S.bonus=true;render();
}
function doDiscard(i){
  const p=cur();const c=p.hand.splice(i,1)[0];S.discard.push(c);p.hand.push(drawRes());
  addLog(`${p.name} discarded ${c.type==='S'?'a Solder card':`a ${c.value} Ω card`} and drew.`);
  S.sel=null;S.preview=null;endTurn();
}
function endTurn(){
  S.bonus=false;S.turnsTaken[S.turn]++;
  if(S.turnsTaken[0]>=S.turnsEach&&S.turnsTaken[1]>=S.turnsEach){finishGame();return;}
  S.turn=1-S.turn;render();maybeAI();
}

// ---------- AI ----------
function frontierDist(pieces){
  const adj=new Map();const add=(u,v)=>{if(!adj.has(u))adj.set(u,[]);adj.get(u).push(v);};
  for(const p of pieces)for(const[a,b]of p.edges){add(a,b);add(b,a);}
  const reach=s=>{const seen=new Set([s]),q=[s];while(q.length){const u=q.shift();for(const v of adj.get(u)||[])if(!seen.has(v)){seen.add(v);q.push(v);}}return seen;};
  const ra=reach(A),rb=reach(B);let d=99;
  for(const u of ra)for(const w of rb)d=Math.min(d,Math.abs(nx(u)-nx(w))+Math.abs(ny(u)-ny(w)));
  return d;
}
function aiValue(pieces,pi){
  const c=analyze(pieces),p=S.players[pi];let v;
  if(c.R===Infinity)v=-4-0.5*frontierDist(pieces);
  else if(c.R===0)v=-5;
  else v=-3*Math.abs(Math.log(c.R/p.target));
  for(const id of p.secret)if(objById(id).check(c,pi))v+=0.35;
  return v;
}
function aiMove(){
  if(S.phase!=='play'||!cur().isAI)return;
  const pi=S.turn,p=cur();
  const base=aiValue(S.pieces,pi);
  let best={v:-1e9};
  const consider=(v,act)=>{v+=Math.random()*0.04;if(v>best.v)best={v,act};};
  const opts=[];
  p.hand.forEach((c,i)=>{if(c.type==='R')opts.push({src:'hand',i,c});});
  S.pool.forEach((c,i)=>opts.push({src:'pool',i,c}));
  const seenVal=new Set();
  for(const o of opts){
    const key=o.c.type+(o.c.value||o.c.len);if(seenVal.has(key))continue;seenVal.add(key);
    const tried=new Set();
    for(const slot of ALL_SLOTS){
      if(S.occupied.has(ekey(slot[0],slot[1])))continue;
      const e=placementFor(o.c,slot);if(!e)continue;
      const k=e.map(x=>x.join(',')).join(';');if(tried.has(k))continue;tried.add(k);
      const pc=makePiece(o.c,e,pi);S.nextPid--;
      consider(aiValue([...S.pieces,pc],pi),{kind:'place',sel:{src:o.src,i:o.i},edges:e});
    }
  }
  if(!S.bonus){
    const si=p.hand.findIndex(c=>c.type==='S');
    if(si>=0)for(const pc of S.pieces){consider(aiValue(S.pieces.filter(q=>q!==pc),pi)+0.1,{kind:'solder',hi:si,id:pc.id});}
    if(best.v<base-0.05&&base>-3){
      let wi=p.hand.findIndex(c=>c.type==='S');if(wi<0){let mx=-1;p.hand.forEach((c,i)=>{if(c.value>mx){mx=c.value;wi=i;}});}
      best={act:{kind:'discard',i:wi}};
    }
  }else if(best.v<base){best={act:{kind:'end'}};}
  const a=best.act;
  if(!a){endTurn();return;}
  if(a.kind==='place')doPlace(a.sel,a.edges);
  else if(a.kind==='solder'){doSolder(a.hi,a.id);setTimeout(aiMove,700);}
  else if(a.kind==='discard')doDiscard(a.i);
  else endTurn();
}
function maybeAI(){if(S.phase==='play'&&cur().isAI){render();setTimeout(aiMove,750);}}

// ---------- end of game ----------
function finishGame(){
  S.phase='predict';S.sel=null;render();
  const humans=S.players.map((p,i)=>[p,i]).filter(([p])=>!p.isAI);
  openModal(`<h2>Board complete!</h2>
    <p>Before the reveal, work out the equivalent resistance between <b>A</b> and <b>B</b> yourself.
    Enter your answer for a <b>+1 bonus point</b> if you're within 2%. Type <code>open</code> for an open circuit. Leave blank to skip.</p>
    ${humans.map(([p,i])=>`<div class="row"><b style="color:${PCOL[i]};min-width:90px">${p.name}</b><input type="text" id="pred${i}" placeholder="Ω"></div>`).join('')}
    <div class="row"><button class="primary" id="reveal">Reveal &amp; score</button></div>`,null,true,'Show the calculation window');
  $('reveal').onclick=()=>{
    humans.forEach(([p,i])=>{const t=$('pred'+i).value.trim().toLowerCase();p.predict=t===''?null:(/^(open|inf|∞|infinity)/.test(t)?Infinity:parseFloat(t));});
    scoreGame();
  };
}
function scoreGame(){
  const c=analyze(S.pieces);S.phase='over';S.showCurrent=closed(c);$('chkCurrent').checked=S.showCurrent;
  const err=S.players.map(p=>closed(c)?Math.abs(c.R-p.target)/p.target:(c.R===0?Math.abs(0-p.target)/p.target:Infinity));
  const minErr=Math.min(...err);
  const rows=S.players.map((p,i)=>{
    let pts=0;const lines=[];
    const winP=isFinite(minErr)&&Math.abs(err[i]-minErr)<1e-9;
    if(winP)pts+=2;
    lines.push(`<tr><td>Primary: target ${fmt(p.target)} Ω (off by ${isFinite(err[i])?(err[i]*100).toFixed(1)+'%':'∞'})</td><td class="${winP?'ok':'no'}">${winP?'+2':'0'}</td></tr>`);
    for(const id of p.secret){const o=objById(id),ok=o.check(c,i);if(ok)pts++;lines.push(`<tr><td>${o.name}: <small>${o.desc}</small></td><td class="${ok?'ok':'no'}">${ok?'+1':'0'}</td></tr>`);}
    if(p.predict!==null&&p.predict!==undefined&&!Number.isNaN(p.predict)){
      const ok=(p.predict===Infinity&&c.R===Infinity)||(isFinite(c.R)&&isFinite(p.predict)&&Math.abs(p.predict-c.R)<=Math.max(0.02*c.R,0.01));
      if(ok)pts++;lines.push(`<tr><td>Prediction: you said ${fmt(p.predict)} Ω</td><td class="${ok?'ok':'no'}">${ok?'+1':'0'}</td></tr>`);
    }
    p.score+=pts;
    return `<h3 style="color:${PCOL[i]}">${p.name} — ${pts} pt${pts===1?'':'s'} this game</h3><table class="res">${lines.join('')}</table>`;
  });
  addLog(`Game ${S.game} over: R_AB = ${fmt(c.R)} Ω.`);
  render();
  const desc=c.R===Infinity?'an <b>open circuit</b> — no complete path from A to B':(c.R===0?'a <b>dead short</b> — a wire-only path joins A and B':`<b>${fmt(c.R)} Ω</b>`);
  openModal(`<h2>Final R<sub>AB</sub> = ${fmt(c.R)} Ω</h2><p>The finished circuit is ${desc}.</p>${rows.join('')}
    <p><b>Match score:</b> ${S.players.map((p,i)=>`<span style="color:${PCOL[i]}">${p.name} ${p.score}</span>`).join(' · ')}</p>
    <div class="row"><button class="primary" id="nextG">Next game</button></div>`,null,true,'Show the scores');
  $('nextG').onclick=()=>{closeModal();newGame();};
}

// ---------- rendering ----------
function resistorPath(len){ // along +x from 0 to len
  const l0=len*0.28,l1=len*0.72,n=6,w=(l1-l0)/n,h=11;let d=`M0 0 L${l0} 0`;
  for(let i=0;i<n;i++)d+=` L${l0+w*(i+.5)} ${i%2?h:-h}`;
  return d+` L${l1} 0 L${len} 0`;
}
function render(){
  if(!S)return;
  const c=analyze(S.pieces);
  const svg=$('board');let h='';
  // slots
  for(const s of ALL_SLOTS){const k=ekey(s[0],s[1]);if(S.occupied.has(k))continue;
    h+=`<line class="slotvis" x1="${px(s[0])}" y1="${py(s[0])}" x2="${px(s[1])}" y2="${py(s[1])}"/>`;}
  // pieces
  const resInfo=new Map(c.res.map(r=>[r.p.id,r]));
  const solderMode=S.phase==='play'&&!cur().isAI&&S.sel&&cardOf(S.sel,S.turn)?.type==='S';
  for(const p of S.pieces){
    const col=PCOL[p.owner];
    if(p.type==='W'){
      const e0=p.edges[0],e1=p.edges[p.edges.length-1];
      let live='';if(S.showCurrent){const n=c.find(e0[0]);live=c.netV.has(n)?'':' opacity="0.45"';}
      h+=`<g class="piece ${solderMode?'target':''}" data-piece="${p.id}"${live}><line x1="${px(e0[0])}" y1="${py(e0[0])}" x2="${px(e1[1])}" y2="${py(e1[1])}" stroke="${col}" stroke-width="7" stroke-linecap="round"/></g>`;
    }else{
      const [a,b]=p.edges[0];const x1=px(a),y1=py(a),ang=ny(a)===ny(b)?0:90;const r=resInfo.get(p.id);
      const dim=(S.showCurrent&&!r.active)||(S.showLive&&r.shorted);
      const lbl=S.showCurrent&&r.active?`${p.value} Ω · ${fmt(r.I)} A`:`${p.value} Ω`;
      const lx=ang?x1+16:x1+SP/2, ly=ang?y1+SP/2+5:y1-16;
      h+=`<g class="piece ${solderMode?'target':''}" data-piece="${p.id}" opacity="${dim?0.35:1}">
        <rect x="${Math.min(x1,px(b))-14}" y="${Math.min(y1,py(b))-14}" width="${Math.abs(px(b)-x1)+28}" height="${Math.abs(py(b)-y1)+28}" fill="transparent"/>
        <path d="${resistorPath(SP)}" transform="translate(${x1} ${y1}) rotate(${ang})" fill="none" stroke="${col}" stroke-width="3.5" stroke-linejoin="round"/>
        <text x="${lx}" y="${ly}" font-size="15" font-weight="700" fill="${S.showCurrent&&r.active?'#0d7a32':col}" text-anchor="${ang?'start':'middle'}">${lbl}</text></g>`;
    }
  }
  // preview
  if(S.preview&&S.preview.edges){
    const card=cardOf(S.sel,S.turn);const col=PCOL[S.turn];
    if(card.type==='W'){const e=S.preview.edges;h+=`<line x1="${px(e[0][0])}" y1="${py(e[0][0])}" x2="${px(e[e.length-1][1])}" y2="${py(e[e.length-1][1])}" stroke="${col}" stroke-width="7" stroke-linecap="round" opacity="0.4" pointer-events="none"/>`;}
    else{const[a,b]=S.preview.edges[0];h+=`<path d="${resistorPath(SP)}" transform="translate(${px(a)} ${py(a)}) rotate(${ny(a)===ny(b)?0:90})" fill="none" stroke="${col}" stroke-width="3.5" opacity="0.4" pointer-events="none"/>`;}
  }
  // nodes
  for(let n=0;n<COLS*ROWS;n++){if(n===A||n===B)continue;const used=(S.nodeUse.get(n)||0)>0;
    h+=`<circle cx="${px(n)}" cy="${py(n)}" r="${used?5:3}" fill="${used?'#1f2328':'#cfc6b3'}" pointer-events="none"/>`;}
  for(const [n,l,fc] of [[A,'A','#b91c1c'],[B,'B','#1f2328']]){
    h+=`<circle cx="${px(n)}" cy="${py(n)}" r="16" fill="${fc}"/><text x="${px(n)}" y="${py(n)+6}" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" pointer-events="none">${l}</text>`;}
  // hit slots last (on top) when placing
  const placing=S.phase==='play'&&!cur().isAI&&S.sel&&cardOf(S.sel,S.turn)?.type!=='S';
  if(placing)for(const s of ALL_SLOTS){if(S.occupied.has(ekey(s[0],s[1])))continue;
    h+=`<line class="slot" data-slot="${s[0]},${s[1]}" x1="${px(s[0])}" y1="${py(s[0])}" x2="${px(s[1])}" y2="${py(s[1])}"/>`;}
  svg.innerHTML=h;

  // meter
  const m=$('meter');
  if(S.showLive||S.phase==='over'){m.innerHTML=`R<sub>AB</sub> = ${c.R===Infinity?'∞ (open)':c.R===0?'0 Ω (short!)':fmt(c.R)+' Ω'}`;}
  else m.innerHTML='R<sub>AB</sub> = ? <small style="color:#888">(calculate it!)</small>';

  // score
  $('score').innerHTML=S.players.map((p,i)=>`<span class="chip" style="border-color:${PCOL[i]};color:${PCOL[i]}">${p.name}: ${p.score}</span>`).join('')+`<span style="color:var(--muted);font-weight:400;align-self:center">Game ${S.game}</span>`;

  // turn info
  const p=cur();
  if(S.phase==='over'){$('turnInfo').innerHTML='Game over';$('hint').textContent='Press "New match" or use the results window to continue.';}
  else if(S.phase==='play'){
    $('turnInfo').innerHTML=`<span style="color:${PCOL[S.turn]}">${p.name}</span>'s turn <small>(turn ${S.turnsTaken[S.turn]+1} of ${S.turnsEach})</small>`;
    let hint='';
    if(p.isAI)hint='Computer is thinking…';
    else if(S.bonus)hint='Solder used — place one more piece from your hand or the pool, or End turn.';
    else if(!S.sel)hint='Pick a card from your hand or the shared wire pool.';
    else{const cd=cardOf(S.sel,S.turn);hint=cd.type==='S'?'Solder: tap any piece on the board to remove it (or Discard this card).':'Tap a dotted slot touching the circuit (A, B, or any placed piece). On touch screens tap once to preview, again to place.';}
    $('hint').textContent=hint;
  }else if(S.phase==='predict'){$('turnInfo').innerHTML='Board complete — calculate R<sub>AB</sub>!';$('hint').textContent='Hide or drag the calculation window to study the board.';}
  else{$('turnInfo').textContent='Setting up…';$('hint').textContent='';}

  // secret panel: show the human whose turn it is (or the only human)
  let viewer=S.turn;if(S.players[viewer].isAI)viewer=S.players.findIndex(q=>!q.isAI);
  const vp=S.players[viewer];
  const peek=humanCount()>1;
  const sec=`<b>Target:</b> ${fmt(vp.target)} Ω<ul>${vp.secret.map(id=>`<li><b>${objById(id).name}</b> — ${objById(id).desc}</li>`).join('')}</ul>`;
  $('secretPanel').innerHTML=`<h3 style="color:${PCOL[viewer]}">${vp.name}'s secret goals</h3>`+(peek&&S.phase!=='over'?`<div class="peek"><div id="secBody" class="blur">${sec}</div><button id="peekBtn" style="margin-top:6px">Hold to peek</button></div>`:sec)+
    (S.mode==='ai'&&S.phase==='over'?`<div style="margin-top:8px;color:var(--muted)">Computer's target was ${fmt(S.players[1].target)} Ω.</div>`:'');
  if($('peekBtn')){const b=$('peekBtn'),s=$('secBody');const on=e=>{e.preventDefault();s.classList.remove('blur');},off=()=>s.classList.add('blur');
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);}

  // hand & pool
  const hp=S.players[p.isAI?viewer:S.turn];
  const active=S.phase==='play'&&!p.isAI;
  const cardHTML=(cd,src,i)=>{
    const sel=S.sel&&S.sel.src===src&&S.sel.i===i;
    const dis=!active||(S.bonus&&cd.type==='S');
    if(cd.type==='R')return`<div class="card ${sel?'sel':''} ${dis?'disabled':''}" data-src="${src}" data-i="${i}"><svg width="44" height="18" viewBox="0 0 80 24"><path d="${resistorPath(80)}" transform="translate(0 12)" fill="none" stroke="#1f2328" stroke-width="3"/></svg><div class="v">${cd.value} Ω</div><div class="t">resistor</div></div>`;
    if(cd.type==='S')return`<div class="card solder ${sel?'sel':''} ${dis?'disabled':''}" data-src="${src}" data-i="${i}"><div style="font-size:24px">🔥</div><div class="v" style="font-size:14px">Solder</div><div class="t">remove 1</div></div>`;
    return`<div class="card wire ${sel?'sel':''} ${dis?'disabled':''}" data-src="${src}" data-i="${i}"><svg width="48" height="12"><line x1="4" y1="6" x2="${4+cd.len*13.3}" y2="6" stroke="#1f2328" stroke-width="5" stroke-linecap="round"/></svg><div class="v">×${cd.len}</div><div class="t">wire</div></div>`;
  };
  $('hand').innerHTML=S.phase==='play'&&p.isAI?hp.hand.map(()=>`<div class="card disabled" style="background:#e9e3d4"></div>`).join('').replace(/^/, '')+`<div style="font-size:13px;color:var(--muted);align-self:center">Computer's hand</div>`:hp.hand.map((cd,i)=>cardHTML(cd,'hand',i)).join('');
  $('pool').innerHTML=S.pool.map((cd,i)=>cardHTML(cd,'pool',i)).join('');
  $('btnDiscard').disabled=!(active&&!S.bonus&&S.sel&&S.sel.src==='hand');
  $('btnEnd').disabled=!(active&&S.bonus);
  $('log').innerHTML=S.log.map(t=>`<div>${t}</div>`).join('');
}

function enableDrag(handle,box){
  let sx,sy,ox=0,oy=0,dragging=false;
  handle.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;dragging=true;sx=e.clientX;sy=e.clientY;const m=/translate\((-?[\d.]+)px, (-?[\d.]+)px\)/.exec(box.style.transform);ox=m?+m[1]:0;oy=m?+m[2]:0;handle.setPointerCapture(e.pointerId);});
  handle.addEventListener('pointermove',e=>{if(!dragging)return;box.style.transform=`translate(${ox+e.clientX-sx}px, ${oy+e.clientY-sy}px)`;});
  const end=()=>{dragging=false;};handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);
}
